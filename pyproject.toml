[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praetor-honeypot"
version = "1.0.0"
description = "Autonomous Cyber Deception Platform using CMARL, Digital Twin Simulation, and Explainable AI"
readme = "README.md"
authors = [
    { name = "nayefsiddique-eng" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "SQLAlchemy>=2.0.51",
    "pydantic>=2.13.4",
    "pydantic-settings",
    "scikit-learn>=1.9.0",
    "xgboost>=3.3.0",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "httpx",
    "geoip2>=5.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
