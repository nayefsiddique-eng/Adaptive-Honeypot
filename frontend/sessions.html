<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRAETOR — Sessions</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Minimal page-specific styles */
    .page-header {
      margin-bottom: 24px;
    }
    .page-header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--text-primary);
    }
    .page-header .subtitle {
      margin: 4px 0 0 0;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    .filter-bar {
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Sidebar Mount -->
    <div id="sidebarMount"></div>

    <div class="main-wrapper">
      <!-- Minimal Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <!-- Page context -->
        </div>
      </header>

      <main class="page-content">
        <!-- Page Header -->
        <div class="page-header">
          <h1>Session forensics</h1>
          <p class="subtitle">Attacker behavior profiles and interaction timelines</p>
        </div>

        <!-- 2. FILTER CONTROLS -->
        <section class="filter-bar">
          <input type="text" id="filterIp" class="input" placeholder="Search IP address..." oninput="filterSessions()">
          <select id="filterStatus" class="input" onchange="filterSessions()">
            <option value="all">All States</option>
            <option value="active">Active Sessions</option>
            <option value="closed">Closed Sessions</option>
          </select>
          <select id="filterRisk" class="input" onchange="filterSessions()">
            <option value="all">All Risk Levels</option>
            <option value="critical">Critical (80+)</option>
            <option value="high">High (60-70)</option>
            <option value="medium">Medium (40-59)</option>
          </select>
        </section>

        <!-- 3. CARDS DECK GRID -->
        <section class="session-grid" id="deckContainer">
          <div class="empty-state" style="grid-column: 1 / -1; text-align: center;">Syncing session nodes...</div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let allSessions = [];
    let expandedSessionId = null;

    async function loadSessionsPage() {
      allSessions = await fetchers.sessions();
      renderDeck(allSessions);
    }

    function getRiskColorToken(score) {
      if (score >= 80) return 'var(--severity-critical)';
      if (score >= 60) return 'var(--severity-high)';
      if (score >= 40) return 'var(--severity-medium)';
      return 'var(--severity-low)';
    }

    function renderDeck(sessions) {
      const deck = document.getElementById("deckContainer");
      if (!sessions.length) {
        deck.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1; text-align: center;">No threat sessions matches the active filters.</div>`;
        return;
      }

      let html = "";
      sessions.forEach(sess => {
        const truncId = sess.session_id.substring(0, 8);
        const activeBadge = sess.is_active 
          ? `<span class="badge badge-low">ACTIVE</span>` 
          : `<span class="badge badge-neutral" style="background:var(--surface-2); color:var(--text-tertiary); border:1px solid var(--border-subtle);">CLOSED</span>`;
        
        const chainBadge = sess.attack_chain_name
          ? `<span class="badge badge-high" style="margin-left:8px;">${sess.attack_chain_name.toUpperCase()}</span>`
          : "";

        const decScore = (sess.deception_score_avg || 0.00).toFixed(2);
        const riskColor = getRiskColorToken(sess.risk_score);

        html += `
          <div class="session-card" id="card_${sess.session_id}" onclick="expandSession('${sess.session_id}')">
            <div class="session-card-header">
              <span style="font-family:var(--font-mono); color:var(--accent); font-weight:700;">#${truncId}</span>
              <div style="display:flex; align-items:center; gap:8px;">${sess.country || 'Unknown'} ${activeBadge}</div>
            </div>
            
            <div class="session-card-body" style="display:flex; justify-content:space-between; align-items:center; margin:12px 0;">
              <div style="font-family:var(--font-mono); font-size:2.2rem; font-weight:700; color:${riskColor};">${sess.risk_score}</div>
              <div style="text-align:right;">
                <div style="font-family:var(--font-mono); font-size:16px; font-weight:700; color:var(--text-primary);">${sess.attack_count}</div>
                <div style="font-size:9px; color:var(--text-tertiary); text-transform:uppercase;">attacks ${chainBadge}</div>
              </div>
            </div>
            
            <div class="session-card-footer" style="display:flex; justify-content:space-between; border-top:1px solid var(--border-subtle); padding-top:8px; font-size:11px; color:var(--text-tertiary);">
              <span>DECP: <strong style="color:var(--text-secondary);">${decScore}</strong></span>
              <span>DEPTH: <strong style="color:var(--text-secondary);">${sess.interaction_depth}/4</strong></span>
              <span>DUR: <strong style="color:var(--text-secondary);">${(sess.session_duration || 0).toFixed(0)}s</strong></span>
            </div>
          </div>
          
          <div class="card" id="timeline_${sess.session_id}" style="grid-column: 1 / -1; display: none; padding: 20px; margin-top: 8px; margin-bottom: 16px;">
            <!-- Expanded Timeline player container -->
          </div>
        `;
      });
      deck.innerHTML = html;
    }

    async function expandSession(id) {
      const prevWrapper = document.getElementById(`timeline_${expandedSessionId}`);
      if (prevWrapper) {
        prevWrapper.style.display = "none";
      }

      if (expandedSessionId === id) {
        expandedSessionId = null;
        return;
      }

      expandedSessionId = id;
      const wrapper = document.getElementById(`timeline_${id}`);
      wrapper.style.display = "block";
      wrapper.innerHTML = `<div class="empty-state">Reconstructing vertical threat path...</div>`;
      
      const timeline = await fetchers.timeline(id);
      renderTimeline(wrapper, timeline);
    }

    function renderTimeline(wrapper, timeline) {
      if (!timeline.length) {
        wrapper.innerHTML = `<div class="empty-state">No interaction path traces logged for this session node.</div>`;
        return;
      }

      let nodesHtml = "";
      timeline.forEach(t => {
        const delta = t.delta_seconds || 0;
        const mitre = t.mitre_technique ? `MITRE ID: ${t.mitre_technique}` : "MITRE: Monitor";
        const riskColor = getRiskColorToken(t.risk_score);
        
        nodesHtml += `
          <div class="vtimeline-node">
            <span class="vtimeline-dot" style="background-color:${riskColor};"></span>
            <div class="vtimeline-time">T+${delta}s | ${mitre}</div>
            <div class="vtimeline-content">
              <div style="font-family:var(--font-mono); font-weight:700; color:var(--accent); font-size:12px; display:flex; justify-content:space-between;">
                <span>${t.attack_type.toUpperCase().replace(/_/g, ' ')}</span>
                <span style="color:${riskColor}">RISK: ${t.risk_score}</span>
              </div>
              <div style="font-size:10px; color:var(--text-tertiary); margin-top:4px;">
                Deception state: <strong style="color:var(--severity-low)">${t.deception_state.toUpperCase()}</strong>
              </div>
            </div>
          </div>
        `;
      });

      wrapper.innerHTML = `
        <h3 class="card-title" style="margin-top:0; margin-bottom:16px;">Attack timeline</h3>
        <div class="vtimeline">
          ${nodesHtml}
        </div>
      `;
    }

    function filterSessions() {
      const ip = document.getElementById("filterIp").value.trim().toLowerCase();
      const status = document.getElementById("filterStatus").value;
      const risk = document.getElementById("filterRisk").value;

      let filtered = allSessions;
      
      if (ip) {
        filtered = filtered.filter(s => s.ip_address.toLowerCase().includes(ip));
      }
      
      if (status === "active") {
        filtered = filtered.filter(s => s.is_active);
      } else if (status === "closed") {
        filtered = filtered.filter(s => !s.is_active);
      }

      if (risk === "critical") {
        filtered = filtered.filter(s => s.risk_score >= 80);
      } else if (risk === "high") {
        filtered = filtered.filter(s => s.risk_score >= 60 && s.risk_score < 80);
      } else if (risk === "medium") {
        filtered = filtered.filter(s => s.risk_score >= 40 && s.risk_score < 60);
      }

      renderDeck(filtered);
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.renderSidebar) {
        renderSidebar('sessions');
      }
      loadSessionsPage();
    });
  </script>
</body>
</html>
