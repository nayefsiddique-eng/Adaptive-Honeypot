<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRAETOR — Intelligence</title>
  
  <!-- Leaflet CDNs -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-wrapper">
      <div class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">Intelligence</div>
        </div>
        <div class="topbar-right">
          <div id="utcClock" style="font-family: var(--font-mono); color: var(--text-secondary); margin-right: 16px;">00:00:00 UTC</div>
        </div>
      </div>

      <div class="page-content">
        <div class="grid grid-cols-2">
          
          <!-- Section 1: IP Lookup -->
          <div class="col-span-12">
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">IP reputation lookup</h2>
              </div>
              <div style="display: flex; gap: 12px; margin-top: 8px; max-width: 600px;">
                <input type="text" id="ipLookupInput" class="input" placeholder="Search IP address..." onkeydown="if(event.key==='Enter') lookupIp()">
                <button onclick="lookupIp()" class="btn btn-primary">Scan</button>
              </div>
              
              <!-- Result grid -->
              <div id="ipResultBox" class="hidden" style="margin-top: 16px; animation: slideDownIn 0.3s ease-out;">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-family:var(--font-mono); font-size:12px;">
                  <span>TOTAL ATTACKS: <strong id="resCount" style="color:var(--accent);">0</strong></span>
                  <span>FIRST SEEN: <span id="resFirst" style="color:var(--text-tertiary);">N/A</span></span>
                  <span>LAST SEEN: <span id="resLast" style="color:var(--text-tertiary);">N/A</span></span>
                </div>
                <div style="margin-bottom:12px;">
                  <span style="font-size:10px; color:var(--text-tertiary); text-transform:uppercase; margin-right:8px;">Attack Types:</span>
                  <span id="resBadges"></span>
                </div>
                
                <div class="table-wrapper" style="max-height: 200px; overflow-y: auto;">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th>Time</th>
                        <th>Port</th>
                        <th>Protocol</th>
                        <th>Risk</th>
                        <th>Payload</th>
                      </tr>
                    </thead>
                    <tbody id="resRows"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Section 2: Threat Map -->
          <div class="col-span-12">
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Threat geography</h2>
              </div>
              <div id="threatMap" class="map-container" style="height: 400px; width: 100%;"></div>
            </div>
          </div>

          <!-- Section 3-5 Metrics -->
          <div class="col-span-12" id="metricsContainer">
            <div style="color: var(--text-tertiary); text-align: center; padding: 32px 0;">Syncing research evaluation telemetry...</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Inject sidebar
    document.addEventListener("DOMContentLoaded", () => {
      if (window.renderSidebar) {
        renderSidebar('intelligence');
      }
      loadIntelPage();
    });

    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById("utcClock").textContent = now.toISOString().replace('T', ' ').substring(11, 19) + ' UTC';
    }
    setInterval(updateClock, 1000);
    updateClock();

    let map = null;
    let markersGroup = null;

    function initMap() {
      map = L.map('threatMap', {
        center: [20.0, 0.0],
        zoom: 2,
        zoomControl: true,
        attributionControl: false
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 18
      }).addTo(map);

      markersGroup = L.markerClusterGroup().addTo(map);
    }

    async function loadIntelPage() {
      initMap();
      
      const metrics = await fetchers.research();
      const logs = await fetchers.logs();
      
      renderMetrics(metrics);
      plotThreats(logs);
    }

    async function lookupIp() {
      const ip = document.getElementById("ipLookupInput").value.trim();
      if (!ip) return;

      const logs = await fetchers.logs(ip);
      const box = document.getElementById("ipResultBox");
      
      if (!logs.length) {
        box.classList.remove("hidden");
        document.getElementById("resCount").textContent = "0";
        document.getElementById("resFirst").textContent = "N/A";
        document.getElementById("resLast").textContent = "N/A";
        document.getElementById("resBadges").innerHTML = "";
        document.getElementById("resRows").innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-tertiary);">No matching IP logs found.</td></tr>`;
        return;
      }

      box.classList.remove("hidden");
      document.getElementById("resCount").textContent = logs.length;
      document.getElementById("resFirst").textContent = new Date(logs[logs.length - 1].timestamp).toLocaleDateString();
      document.getElementById("resLast").textContent = new Date(logs[0].timestamp).toLocaleDateString();

      // Collect unique badges
      const types = [...new Set(logs.map(l => l.attack_type))];
      let badgesHtml = "";
      types.forEach(t => {
        badgesHtml += `<span class="badge badge-neutral" style="margin-right:6px;">${t.replace(/_/g, ' ')}</span>`;
      });
      document.getElementById("resBadges").innerHTML = badgesHtml;

      // Table rows
      let rowsHtml = "";
      logs.forEach(l => {
        rowsHtml += `
          <tr>
            <td style="color:var(--text-tertiary); font-family:var(--font-mono);">${new Date(l.timestamp).toLocaleTimeString()}</td>
            <td>${l.port}</td>
            <td>${l.protocol.toUpperCase()}</td>
            <td><strong style="color:${riskColor(l.risk_score)}">${l.risk_score}</strong></td>
            <td style="font-family:monospace; max-width:400px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.raw_payload || 'No payload'}</td>
          </tr>
        `;
      });
      document.getElementById("resRows").innerHTML = rowsHtml;
    }

    function plotThreats(logs) {
      markersGroup.clearLayers();
      if (!logs.length) return;

      const uniqueIps = {};
      logs.forEach(l => {
        if (!l.latitude || !l.longitude) return;
        
        if (!uniqueIps[l.ip_address]) {
          uniqueIps[l.ip_address] = {
            lat: l.latitude,
            lon: l.longitude,
            count: 0,
            maxRisk: 0,
            lastType: l.attack_type,
            country: l.country || "Unknown"
          };
        }
        uniqueIps[l.ip_address].count++;
        uniqueIps[l.ip_address].maxRisk = Math.max(uniqueIps[l.ip_address].maxRisk, l.risk_score);
      });

      Object.keys(uniqueIps).forEach(ip => {
        const item = uniqueIps[ip];
        const color = riskColor(item.maxRisk);
        
        const marker = L.circleMarker([item.lat, item.lon], {
          radius: Math.min(8 + (item.count * 1.5), 18),
          fillColor: color,
          color: color,
          fillOpacity: 0.5,
          weight: 1
        });

        const popup = `
          <div style="font-family:var(--font-sans); font-size:11px; color:var(--text-primary); line-height:1.4;">
            <strong>IP: ${ip}</strong><br/>
            Location: ${item.country}<br/>
            Severity: <strong style="color:${color}">${item.maxRisk}</strong><br/>
            Attacks Count: ${item.count}
          </div>
        `;
        marker.bindPopup(popup);
        markersGroup.addLayer(marker);
      });
    }

    function renderMetrics(metrics) {
      const container = document.getElementById("metricsContainer");
      if (metrics.error) {
        container.innerHTML = `<div style="color: var(--severity-critical); text-align: center;">Failed to retrieve research stats from DB.</div>`;
        return;
      }

      const nm = metrics.new_metrics || {};
      const fields = [
        { label: "Avg Deception Score", value: nm.avg_deception_score ? nm.avg_deception_score.toFixed(2) : "0.00", highlight: true },
        { label: "Chain Detection Rate", value: nm.chain_detection_rate ? (nm.chain_detection_rate * 100).toFixed(0) + "%" : "0%", highlight: true },
        { label: "Total Ingress Attacks", value: metrics.total_attacks || 0 },
        { label: "Unique Attacker Footprints", value: metrics.total_unique_ips || 0 },
        { label: "Model Classification (Ens)", value: (metrics.detection_rate_pct || 0) + "%" },
        { label: "False Positive Ratio", value: (metrics.false_positive_rate_pct || 0) + "%" },
        { label: "Mean Ingest Latency", value: (metrics.average_response_time_ms || 0).toFixed(1) + "ms" },
        { label: "Repeat Intruder Ratio", value: nm.repeat_attacker_rate ? (nm.repeat_attacker_rate * 100).toFixed(0) + "%" : "0%" }
      ];

      let html = `
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <h2 class="card-title">Research metrics</h2>
          </div>
          <div class="grid grid-cols-2">
      `;
      
      fields.forEach(f => {
        const highlightClass = f.highlight ? " highlight" : "";
        html += `
            <div class="research-card${highlightClass}">
              <div class="research-label">${f.label}</div>
              <div class="research-value">${f.value}</div>
            </div>
        `;
      });

      html += `
          </div>
        </div>
      `;

      // Append Cache Hit rates horizontal bars
      const geminiCache = nm.gemini_cache_hit_rate ? (nm.gemini_cache_hit_rate * 100).toFixed(0) : "0";
      const intelCache = nm.intel_cache_hit_rate ? (nm.intel_cache_hit_rate * 100).toFixed(0) : "0";
      
      html += `
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <h2 class="card-title">Cache performance</h2>
          </div>
          <div style="margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px;">
              <span style="color:var(--text-secondary);">LLM Summary Cache Hit Rate</span>
              <strong style="color:var(--accent);">${geminiCache}%</strong>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${geminiCache}%;"></div>
            </div>
          </div>
          <div>
            <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px;">
              <span style="color:var(--text-secondary);">IP Reputation Cache Hit Rate</span>
              <strong style="color:var(--accent);">${intelCache}%</strong>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${intelCache}%;"></div>
            </div>
          </div>
        </div>
      `;

      // Append Tool Signature breakdown inline CSS bar chart
      const signatures = nm.unique_tool_signatures || { sqlmap: 0, nmap: 0, hydra: 0, metasploit: 0, custom: 0 };
      const sigTotal = Object.values(signatures).reduce((a, b) => a + b, 0) || 1;
      
      let sigRows = "";
      Object.keys(signatures).forEach(key => {
        const pct = ((signatures[key] / sigTotal) * 100).toFixed(0);
        sigRows += `
          <div class="bar-row">
            <span class="bar-label">${key}</span>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%;"></div>
            </div>
            <span class="bar-value">${signatures[key]}</span>
          </div>
        `;
      });

      html += `
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Threat signatures</h2>
          </div>
          <div class="bar-chart">
            ${sigRows}
          </div>
        </div>
      `;

      container.innerHTML = html;
    }
  </script>
</body>
</html>
