name: PRAETOR Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run Tests
      run: |
        python -m pytest tests/

    - name: Run Integration Test
      run: |
        python ml/test_api.py

    - name: Exercise listeners on loopback
      run: python scripts/verify_loopback.py

  container-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify disposable management and deception planes
        run: bash scripts/verify_container_isolation.sh
